<!DOCTYPE html>
<html lang="en">
<Script>
  const version = 'v_01 (H 20260617)';
  document.documentElement.style.setProperty('--version', `"${version}"`);
</Script>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosk About Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body::after {
      content: var("version: " --version, "N/A") " | " var(--SecessionId, "N/A");
      position: fixed;
      right: 10px;
      bottom: 15px;
      font-size: 12px;
      color: Black;
      z-index: 999999;
      pointer-events: none;
    }

    #about-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    #about-container img,
    #about-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .about-text {
      position: absolute;
      left: 50px;
      right: 50px;
      bottom: 50px;
      color: #fff;
      font-size: 42px;
      font-weight: 700;
      line-height: 1.3;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      z-index: 2;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top,
          rgba(0, 0, 0, 0.7),
          rgba(0, 0, 0, 0.2),
          transparent);
      z-index: 1;
    }

    .error-message {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 40px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="about-container"></div>

  <script>
    const aboutPageData = {
      "7065": {
        img: "https://static.virtubox.io/product/image/dqoblr85a34oamw4efbuvda1h4k1ezn2uewedlpmfnyzfus05ujtnpe1ubgq6e5o-orig.png",
        video: "",
        text: "Welcome to Kiosk K001"
      },

      "K002": {
        img: "https://picsum.photos/1920/1080?random=2",
        video: "",
        text: "Welcome to Kiosk K002"
      },

      "K003": {
        img: "",
        video: "sample.mp4",
        text: "Welcome to Kiosk K003"
      }
    };

    function vExecute(command, data, callback, uid) {
      console.log("vExecute:", command);
      const tag = `${command}:${callback}:${uid}`;
      if (typeof VirtuBox !== "undefined") {
        VirtuBox.execute(command, data, tag);
      } else {
        console.warn("VirtuBox not available. Running demo mode.");
        setTimeout(() => {
          const mockResponse = {
            kiosk_id: "K002"
          };
          onKioskResponse(
            command,
            JSON.stringify(mockResponse),
            tag
          );
        }, 1000);
      }
    }

    function onKioskResponse(command, data, tag) {
      console.log("onKioskResponse:", command);
      const callback = tag.split(":")[1];
      if (typeof window[callback] === "function") {
        window[callback](command, data);
      }
    }

    function kioskData() {
      const requestData = JSON.stringify({ command: "kiosk_info" });
      vExecute("kiosk-response", requestData, "callBackKioskData", "KioskInfo");
    }

    function callBackKioskData(command, data) {
      console.log("Kiosk Response:", data);
      let response;
      try {
        response =
          typeof data === "string"
            ? JSON.parse(data)
            : data;
      } catch (error) {
        console.error("Invalid JSON:", error);
        showError("Invalid kiosk response");
        return;
      }
      const kioskId = response.kiosk_id || response.kioskId || response.KioskId;
      if (!kioskId) {
        console.error("Kiosk ID not found");
        showError("Kiosk ID Not Found");
        return;
      }
      console.log("Matched Kiosk:", kioskId);
      const pageData = aboutPageData[kioskId];
      if (!pageData) {
        console.error("No data mapped for:", kioskId);
        showError(`No content configured for ${kioskId}`);
        return;
      }
      renderContent(pageData);
    }

    function renderContent(pageData) {
      const container = document.getElementById("about-container");
      let html = "";
      if (pageData.video) {
        html = `
            <video autoplay muted loop playsinline>
                <source src="${pageData.video}" type="video/mp4">
            </video>
            <div class="overlay"></div>
            <div class="about-text">
                ${pageData.text}
            </div>
        `;
      } else {
        html = `
            <img src="${pageData.img}" alt="Kiosk Image">
            <div class="overlay"></div>
            <div class="about-text">
                ${pageData.text}
            </div>
        `;
      }
      container.innerHTML = html;
    }

    function showError(message) { document.getElementById("about-container").innerHTML = ` <div class="error-message">${message}</div>`; }

    window.addEventListener("load", () => {
      console.log("Page Loaded");
      kioskData();
    });

  </script>

</body>

</html>
